  <ellipse cx="575" cy="340" rx="176" ry="38" fill="#ffffff" stroke="#e6dccb" stroke-width="3"/>
  <ellipse cx="575" cy="338" rx="148" ry="26" fill="#faf6ee"/>
  <use href="#gb" transform="translate(535 270)"/>
  <use href="#gb" transform="translate(615 270)"/>
  <use href="#gb" transform="translate(495 315)"/>
  <use href="#gb" transform="translate(575 318)"/>
  <use href="#gb" transform="translate(655 315)"/>

