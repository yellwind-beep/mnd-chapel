<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="컵라면과 김밥 일러스트">
  <defs>
    <g id="gb">
      <circle r="40" fill="#1f2a24"/>
      <circle r="34" fill="#fffdf7"/>
      <ellipse cx="-22" cy="14" rx="4" ry="2.5" fill="#efe6d2"/>
      <ellipse cx="20" cy="-18" rx="4" ry="2.5" fill="#efe6d2"/>
      <ellipse cx="18" cy="20" rx="3.5" ry="2.2" fill="#efe6d2"/>
      <ellipse cx="-18" cy="-20" rx="3.5" ry="2.2" fill="#efe6d2"/>
      <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#f2c230"/>
      <rect x="-22" y="-6" width="11" height="12" rx="3" fill="#e8742a"/>
      <rect x="11" y="-6" width="11" height="12" rx="3" fill="#4f8a3a"/>
