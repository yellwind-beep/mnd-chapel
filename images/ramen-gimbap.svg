  </g>

  <!-- 김 오르는 표시 -->
  <g fill="none" stroke="#c9bba3" stroke-width="7" stroke-linecap="round" opacity=".8">
    <path d="M262 140 q-14 -22 0 -44 q14 -22 0 -44"/>
    <path d="M302 128 q-14 -22 0 -44 q14 -22 0 -44"/>
    <path d="M342 140 q-14 -22 0 -44 q14 -22 0 -44"/>
  </g>

  <!-- 컵라면 -->
  <ellipse cx="300" cy="366" rx="96" ry="12" fill="#d9c49d" opacity=".7"/>
  <path d="M205 180 L395 180 L375 360 L225 360 Z" fill="#ffffff" stroke="#e3d8c4" stroke-width="3"/>
  <path d="M212 236 L388 236 L383 292 L217 292 Z" fill="#d9472b"/>
  <path d="M240 264 q15 -12 30 0 t30 0 t30 0 t30 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
