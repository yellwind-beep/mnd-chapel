  </g>
  <circle cx="262" cy="178" r="5" fill="#4f8a3a"/>
  <circle cx="330" cy="184" r="5" fill="#e8742a"/>
  <!-- 뚜껑 -->
  <path d="M352 170 Q 400 112 452 98 L 468 132 Q 420 150 396 180 Z" fill="#efe7d8" stroke="#ddd0b8" stroke-width="3"/>
  <path d="M372 160 Q 410 126 452 112" fill="none" stroke="#d9472b" stroke-width="6" stroke-linecap="round"/>
  <!-- 젓가락 -->
  <path d="M168 128 L372 206" stroke="#b5874e" stroke-width="8" stroke-linecap="round"/>
  <path d="M176 112 L380 192" stroke="#c99a5e" stroke-width="8" stroke-linecap="round"/>

  <!-- 접시와 김밥 -->
